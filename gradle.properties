# 本机 JetBrains IDE 安装目录，作为编译平台（不下载 IDE 安装包）
intellijPlatformLocalPath=D:/PyCharm 2025.3.3

# IntelliJ Platform Gradle Plugin 会按平台要求强制使用 Java 21 toolchain。
# 本机 PATH 上只有 JDK 24，所以直接复用 IDE 自带的 JBR（就是插件运行时用的那个 JDK），
# 避免额外下载一个 JDK。此路径需与上面的 IDE 保持一致。
org.gradle.java.installations.paths=D:/PyCharm 2025.3.3/jbr

org.gradle.jvmargs=-Xmx2g
org.gradle.caching=true
# 平台自带 Kotlin 标准库，自带一份会与之冲突（verifyPluginProjectConfiguration 直接报此项）
kotlin.stdlib.default.dependency=false

# JetBrains Marketplace 发布令牌。此键必须存在（值留空即可），否则 build.gradle.kts 里读取不到。
# 发布时用 -PintellijPlatformPublishingToken=perm:xxx 或环境变量
# ORG_GRADLE_PROJECT_intellijPlatformPublishingToken 覆盖，避免把令牌写进仓库。
intellijPlatformPublishingToken=
